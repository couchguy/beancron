[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "beancron"
version = "0.1.0"
description = "A crontab that lives in your Beancount ledger"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["beancount>=3.0"]

[project.scripts]
beancron = "beancron.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
